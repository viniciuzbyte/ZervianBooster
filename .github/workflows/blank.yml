
name: Build Zervian APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate project root
        id: locate
        shell: bash
        run: |
          MATCH=$(find . -maxdepth 8 -name "settings.gradle.kts" -not -path "*/.gradle/*" | head -n 1)

          if [ -z "$MATCH" ]; then
            echo "::error::settings.gradle.kts not found"
            exit 1
          fi

          DIR=$(dirname "$MATCH")

          echo "Project root: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Validate Gradle
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle --version

      - name: Clean project
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle clean

      - name: Run lint
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle lint --stacktrace

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZervianBooster-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
