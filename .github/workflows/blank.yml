name: Build Zervian APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Action resmi ini menyediakan binary Gradle sendiri di runner, jadi
      # TIDAK butuh gradlew/gradle-wrapper.jar sudah di-commit di repo.
      # (gradle-wrapper.jar bukan file teks, tidak bisa saya buat tanpa akses
      # jaringan - lihat README. Setelah kamu generate wrapper via Android
      # Studio & commit, workflow ini tetap jalan - cukup ganti `gradle`
      # jadi `./gradlew` di langkah build kalau mau.)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: gradle lint --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zervian-debug-apk
          path: app/build/outputs/apk/debug/*.apk
