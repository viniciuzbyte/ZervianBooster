name: Build Zervian APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Gradle project root
        id: locate
        run: |
          MATCH=$(find . -maxdepth 4 -name "settings.gradle.kts" | head -n1)
          if [ -z "$MATCH" ]; then
            echo "::error::settings.gradle.kts tidak ketemu sampai 4 folder ke dalam. Cek struktur repo kamu."
            exit 1
          fi
          DIR=$(dirname "$MATCH")
          echo "Project root terdeteksi di: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Lint
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle lint --stacktrace

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zervian-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
