name: Build Zervian APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Action resmi ini menyediakan binary Gradle sendiri di runner, jadi
      # TIDAK butuh gradlew/gradle-wrapper.jar sudah di-commit di repo.
      # (gradle-wrapper.jar bukan file teks, tidak bisa saya buat tanpa akses
      # jaringan - lihat README. Setelah kamu generate wrapper via Android
      # Studio & commit, workflow ini tetap jalan - cukup ganti `gradle`
      # jadi `./gradlew` di langkah build kalau mau.)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Jaga-jaga kalau project ke-nested (mis. repo/ZervianBooster/settings.gradle.kts
      # gara-gara cara extract/upload zip) - cari otomatis folder yang punya
      # settings.gradle.kts, daripada build gagal cuma karena 1 folder salah taruh.
      - name: Locate Gradle project root
        id: locate
        run: |
          echo "=== Struktur folder hasil checkout (sampai 6 level) ==="
          find . -maxdepth 6 -not -path "*/.git/*" | sort

          MATCH=$(find . -maxdepth 8 -name "settings.gradle.kts" -not -path "*/.git/*" | head -n1)
          if [ -z "$MATCH" ]; then
            echo "::error::settings.gradle.kts tidak ketemu sampai 8 folder ke dalam. Lihat daftar folder di atas, cek apakah file ini benar2 ke-commit ke repo."
            exit 1
          fi
          DIR=$(dirname "$MATCH")
          echo "Project root terdeteksi di: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Lint
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle lint --stacktrace

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zervian-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
